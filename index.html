<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>草莓大福預約</title>
</head>

<body style="font-family:sans-serif; max-width:500px; margin:auto; padding:20px;">

<h2>🍓 草莓大福預約系統</h2>

<form id="orderForm">

  <p>
    姓名：<br>
    <input type="text" id="name" required>
  </p>

  <p>
    電話：<br>
    <input type="tel" id="phone" required>
  </p>

  <p>
    數量：<br>
    <input type="number" id="amount" min="1" required>
  </p>

  <button type="submit">送出預約</button>

</form>

<p id="msg"></p>

<script type="module">
import { createOrder } from "./main.js";

const form = document.getElementById("orderForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    amount: Number(document.getElementById("amount").value)
  };

  document.getElementById("msg").innerText = "送出中...";

  const number = await createOrder(data);

  location.href = `/success.html?no=${number}`;
}
