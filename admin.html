<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>草莓大福後台管理</title>
  <style>
    :root {
      --wood: #8E744A;
      --deep: #1f1a16;
      --beige: #f6f1e8;
      --input-border: rgba(0, 0, 0, 0.08);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      color: var(--deep);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #ffffff;
      padding: 32px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 20px;
    }

    /* container but not a card (no background) */
    .container {
      width: 100%;
      max-width: 980px;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 12px 0;
      color: var(--deep);
      font-family: 'Noto Serif TC', serif;
      font-size: 22px;
    }

    .panel {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
    }

    label, .panel h3 {
      color: #fff9f6;
      font-size: 15px;
      margin-bottom: 8px;
      display: block;
    }

    input[type=text], input[type=tel], input[type=number], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      font-size: 15px;
      background: rgba(255,255,255,0.95);
      box-sizing: border-box;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .small-input { width: 90px; }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: var(--wood);
      color: white;
      font-weight: 600;
      box-shadow: 0 6px 12px rgba(142, 116, 74, 0.18);
    }

    /* table responsive */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: rgba(255,255,255,0.92);
      border-radius: 8px;
      padding: 8px;
      box-sizing: border-box;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      background: transparent;
    }

    th, td {
      border: 1px solid rgba(0,0,0,0.06);
      padding: 10px 12px;
      text-align: left;
      color: #2f2a26;
      background: rgba(255,255,255,0.98);
    }

    th {
      background: linear-gradient(90deg, rgba(255,255,255,0.98), rgba(250,245,240,0.98));
      color: var(--wood);
      font-weight: 700;
    }

    tr:nth-child(even) td { background: rgba(248,246,244,0.8); }

    /* hint */
    #adminStockHint { color: var(--wood); font-weight: 600; margin-top: 6px; }

    /* status styles */
    .status-select {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.06);
      font-weight: 600;
    }

    .status-pending { background: #fff8e6; color: #7a5b00; }
    .status-done { background: #e8fbf0; color: #0b6b3a; }
    .status-cancel { background: #fff0f2; color: #9b1b2a; }

    @media (max-width: 900px) {
      body { padding: 20px; }
      .container { padding: 12px; }
      table { min-width: 640px; }
    }

    @media (max-width: 480px) {
      body { padding: 14px; }
      table { min-width: 520px; }
      .controls { flex-direction: column; align-items: stretch; }
      .small-input { width: 100%; }
    }
  </style>
</head>

<body>

  <main class="container" role="main">
    <h2>📋 草莓大福後台管理</h2>

    <section class="panel">
      <h3>⚙️ 每日總量設定</h3>
      <div class="controls">
        <label style="display:none;">今日限定總數</label>
        <input type="number" id="maxInput" class="small-input" min="0" />
        <button onclick="saveMax()" class="btn">儲存新總量</button>
        <div id="adminStockHint"></div>
      </div>
    </section>

    <section class="panel">
      <h3>🔎 篩選與排序</h3>
      <div class="controls">
        <select id="filterStatus" onchange="load()">
          <option value="全部">全部</option>
          <option value="未取貨">未取貨</option>
          <option value="已取貨">已取貨</option>
          <option value="已取消">已取消</option>
        </select>

        <select id="sortBy" onchange="load()">
          <option value="number">號碼（新→舊）</option>
          <option value="time">時間（新→舊）</option>
        </select>

        <select id="sortDir" onchange="load()">
          <option value="desc">降冪</option>
          <option value="asc">升冪</option>
        </select>
      </div>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>號碼</th>
            <th>姓名</th>
            <th>電話</th>
            <th>數量</th>
            <th>狀態</th>
            <th>下單時間 (日期)</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="./main.js"></script>

    <script>
      function statusToClass(status) {
        if (status === '已取貨') return 'status-done';
        if (status === '已取消') return 'status-cancel';
        return 'status-pending';
      }

      function pad(n) { return String(n).padStart(2, '0'); }

      function formatOrderTime(o) {
        try {
          if (o.time && typeof o.time.toDate === 'function') {
            const d = o.time.toDate();
            return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
          }
          // fallback: try parse o.date if it's a string
          if (o.date) {
            const parsed = new Date(o.date);
            if (!isNaN(parsed)) {
              return `${parsed.getMonth()+1}/${parsed.getDate()} ${pad(parsed.getHours())}:${pad(parsed.getMinutes())}`;
            }
            return o.date;
          }
        } catch (e) {
          // ignore and fallthrough
        }
        return '無日期';
      }

      async function load() {
        try {
          const config = await getStockConfig();
          document.getElementById("maxInput").value = config.max;

          const statusFilter = document.getElementById('filterStatus')?.value || '全部';
          const sortBy = document.getElementById('sortBy')?.value || 'number';
          const sortDir = document.getElementById('sortDir')?.value || 'desc';

          const orders = await getOrders({ status: statusFilter, sortBy, sortDir });
          const list = document.getElementById("list");
          list.innerHTML = "";

          const today = getTodayStr();
          let todaySold = 0;

          orders.forEach(o => {
            if (o.date === today && o.status !== '已取消') {
              todaySold += Number(o.amount || 0);
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${o.number}</td>
              <td>${o.name}</td>
              <td>${o.phone}</td>
              <td>${o.amount}</td>
              <td>
                <select onchange="handleStatusChange('${o.id}', this.value)">
                  <option value="未取貨" ${o.status=="未取貨"?"selected":""}>未取貨</option>
                  <option value="已取貨" ${o.status=="已取貨"?"selected":""}>已取貨</option>
                  <option value="已取消" ${o.status=="已取消"?"selected":""}>已取消</option>
                </select>
              </td>
              <td>${formatOrderTime(o)}</td>
            `;
            list.appendChild(tr);

            // apply status class to select for colored appearance
            const sel = tr.querySelector('select');
            if (sel) {
              sel.classList.add('status-select');
              sel.classList.add(statusToClass(o.status));
              // when user changes selection, update class immediately
              sel.addEventListener('change', function() {
                // remove previous status-* classes
                sel.classList.remove('status-pending', 'status-done', 'status-cancel');
                sel.classList.add(statusToClass(sel.value));
              });
            }
          });

          window.handleStatusChange = async function(id, status) {
            try {
              await updateStatus(id, status);
              await load();
            } catch (err) {
              alert('更新狀態失敗：' + err.message);
            }
          }

          document.getElementById("adminStockHint").innerText = `今日統計：已收單 ${todaySold} 份 / 總上限 ${config.max} 份`;

        } catch (err) {
          console.error("載入失敗:", err);
        }
      }

      async function saveMax() {
        const newMax = document.getElementById("maxInput").value;
        if (!newMax || newMax < 0) return alert("請輸入有效的數量");

        try {
          await updateStockConfig(newMax);
          alert("儲存成功！");
          load();
        } catch (err) {
          alert("儲存失敗：" + err.message);
        }
      }

      load();
    </script>

  </main>

</body>

</html>
