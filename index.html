<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍓 草莓大福預約系統</title>
<style>
      :root{
        --wood: #8E744A;
        --deep: #1f1a16;
        --beige: #f6f1e8;
        --card-radius: 14px;
        --input-border: rgba(0,0,0,0.08);
      }
      html,body{height:100%;margin:0;font-family: 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color:var(--deep);}
      body{
        background-image: linear-gradient(rgba(16,14,12,0.4), rgba(16,14,12,0.4)), url('https://images.unsplash.com/photo-1543357480-c6f2f4b8d6d6?ixlib=rb-4.0.3&auto=format&fit=crop&w=1650&q=80');
        background-size: cover;
        background-position: center 30%;
        display:flex;align-items:center;justify-content:center;padding:32px;
      }
      /* floating card */
      .card{
        width:100%;max-width:420px;background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.96));
        border-radius:var(--card-radius);box-shadow:0 10px 30px rgba(8,6,6,0.35);padding:26px;backdrop-filter: blur(4px);
      }
      .brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
      .logo{
        width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#e9e1d6,#d9cdb7);display:flex;align-items:center;justify-content:center;color:var(--deep);font-weight:600;font-family:'Noto Serif TC', serif;font-size:18px;
      }
      h1.title{font-family:'Noto Serif TC', serif;margin:6px 0 18px;font-size:20px;color:var(--deep);}
      p.subtitle{margin:0 0 18px;color:#6b6156;font-size:13px}

      label{display:block;font-size:13px;color:#4e463f;margin-bottom:6px}
      .field{margin-bottom:12px}
      input[type=text], input[type=tel], input[type=number], select{
        width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--input-border);font-size:15px;background:transparent;outline:none;box-sizing:border-box;
      }
      input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{opacity:0}

      /* toggle group like "用餐餐期" */
      .toggle-group{display:flex;gap:8px;margin:8px 0 16px}
      .toggle{
        flex:1;padding:10px 12px;text-align:center;border-radius:999px;border:1px solid var(--input-border);background:#fff;font-family:'Noto Serif TC', serif;color:#6b6156;cursor:pointer;user-select:none
      }
      .toggle.active{background:var(--wood);color:var(--beige);box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12)}

      .submit{
        width:100%;display:block;padding:12px 16px;border-radius:10px;border:none;background:var(--wood);color:var(--beige);font-family:'Noto Serif TC', serif;font-size:16px;cursor:pointer;margin-top:6px;box-shadow:0 6px 12px rgba(142,116,74,0.18);
      }

      .note{font-size:12px;color:#7a7167;margin-top:10px;text-align:center}

      /* responsive */
      @media (max-width:420px){body{padding:16px}.card{padding:18px}}
    </style>
</head>

<body>

    <main class="card" role="main">
      <div class="brand">
        <div class="logo">和</div>
        <div>
          <h1 class="title">草莓大福 預約系統</h1>
          <p class="subtitle">預約新鮮職人手作草莓大福，限量販售</p>
        </div>
      </div>

  <div id="stockInfo">載入庫存中...</div>

  <form id="orderForm">
    <div class="form-group">
      <label for="name">姓名：</label>
      <input type="text" id="name" placeholder="請輸入訂購人姓名" required>
    </div>

    <div class="form-group">
      <label for="phone">連絡電話：</label>
      <input type="tel" id="phone" placeholder="請輸入電話號碼" required>
    </div>

    <div class="form-group">
      <label for="amount">數量：</label>
      <input type="number" id="amount" min="1" value="1" required>
    </div>

    <button type="submit" id="submitBtn">送出預約</button>
  </form>

  <p id="msg"></p>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="./main.js"></script>

  <script>
    const form = document.getElementById("orderForm");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submitBtn");
    const stockInfo = document.getElementById("stockInfo");

    // 頁面開啟時先檢查庫
    async function checkStock() {
      try {
        // 1. 從資料庫抓取管理員設定的每日總量
        const config = await getStockConfig();
        const MAX_STOCK = config.max;

        // 2. 抓取「今天」已下單的總數
        const today = getTodayStr();
        const snap = await db.collection("orders").where("date", "==", today).get();
        
        let totalSoldToday = 0;
        snap.forEach(doc => {
          const d = doc.data();
          if (d.status === '已取消') return; // 已取消的訂單不計入庫存
          totalSoldToday += Number(d.amount || 0);
        });

        const remain = MAX_STOCK - totalSoldToday;
        
        // 3. 更新介面顯示
        stockInfo.innerText = `今日剩餘：${remain > 0 ? remain : 0} 份 (每日限定 ${MAX_STOCK} 份)`;

        if (remain <= 0) {
          submitBtn.disabled = true;
          submitBtn.innerText = "今日已售罄，明天請早";
          stockInfo.style.color = "red";
          return 0;
        }
        return remain;
      } catch (err) {
        console.error("檢查庫存失敗:", err);
        stockInfo.innerText = "無法取得庫存資訊";
        return 0;
      }
    }

    // 初始化檢查
    checkStock();

    // 處理表單送出
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      // 送出前再次即時檢查庫存
      const remain = await checkStock();
      const inputAmount = Number(document.getElementById("amount").value);

      if (inputAmount > remain) {
        alert(`抱歉，庫存不足！目前只剩 ${remain} 份。`);
        return;
      }

      // 準備資料
      const data = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        amount: inputAmount
      };

      submitBtn.disabled = true;
      msg.innerText = "🚀 訂單傳送中，請稍候...";
      msg.style.color = "blue";

      try {
        // 呼叫 main.js 裡的建立訂單功能
        const no = await createOrder(data);
        // 跳轉到成功頁面並帶上號碼牌
        location.href = `/success.html?no=${no}`;
      } catch (err) {
        alert("預約失敗，請聯絡店家：" + err.message);
        msg.innerText = "";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
