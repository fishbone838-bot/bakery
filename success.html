<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預約成功</title>
  <style>
    :root {
      --wood: #8E744A;
      --deep: #1f1a16;
      --beige: #f6f1e8;
      --card-radius: 14px;
      --input-border: rgba(0, 0, 0, 0.08);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: 'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      color: var(--deep);
      background-image: linear-gradient(rgba(16, 14, 12, 0.4), rgba(16, 14, 12, 0.4)), url('https://images.unsplash.com/photo-1543357480-c6f2f4b8d6d6?ixlib=rb-4.0.3&auto=format&fit=crop&w=1650&q=80');
      background-size: cover;
      background-position: center 30%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.96));
      border-radius: var(--card-radius);
      box-shadow: 0 10px 30px rgba(8, 6, 6, 0.35);
      padding: 26px;
      backdrop-filter: blur(4px);
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      justify-content: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: linear-gradient(135deg, #e9e1d6, #d9cdb7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--deep);
      font-weight: 600;
      font-family: 'Noto Serif TC', serif;
      font-size: 18px;
    }

    h1.title {
      font-family: 'Noto Serif TC', serif;
      margin: 10px 0 0px;
      font-size: 20px;
      color: var(--deep);
    }

    p.subtitle {
      margin: 10px 0px 10px 0px;
      color: #6b6156;
      font-size: 16px;
    }

    .result {
      margin-top: 18px;
      font-size: 18px;
      font-weight: 700;
      color: var(--deep);
    }

    .note {
      font-size: 12px;
      color: #7a7167;
      margin-top: 10px;
      text-align: center
    }

    a.button {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--wood);
      color: var(--beige);
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width:420px) {
      body {
        padding: 16px
      }

      .card {
        padding: 18px
      }
    }
  </style>
</head>

<body>

  <main class="card" role="main">
    <div class="brand">
      <div class="logo">琴</div>
      <div>
        <h1 class="title">草莓大福 預約系統</h1>
        <p class="subtitle">預約新鮮職人手作草莓大福，限量販售</p>
      </div>
    </div>

    <h2>✅ 預約成功</h2>

    <p id="no" class="result">你的號碼牌是：—</p>
    <p class="note">狀態：未取貨</p>

    <a class="button" href="/">回首頁</a>

  </main>

<script>
const url = new URL(location.href);
const no = url.searchParams.get("no");

document.getElementById("no").innerText =
  "你的號碼牌是：" + no;
</script>

</body>

</html>
