<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍓 草莓大福預約系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: auto; padding: 20px; line-height: 1.6; color: #333; }
    h2 { color: #d02090; border-bottom: 2px solid #ffb6c1; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 12px; background-color: #ff69b4; color: white; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #ff1493; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #stockInfo { background: #fff0f5; padding: 10px; border-radius: 4px; font-weight: bold; text-align: center; margin-bottom: 20px; }
    #msg { text-align: center; font-weight: bold; margin-top: 15px; }
  </style>
</head>

<body>

  <h2>🍓 草莓大福預約系統</h2>

  <div id="stockInfo">載入庫存中...</div>

  <form id="orderForm">
    <div class="form-group">
      <label for="name">姓名：</label>
      <input type="text" id="name" placeholder="請輸入訂購人姓名" required>
    </div>

    <div class="form-group">
      <label for="phone">連絡電話：</label>
      <input type="tel" id="phone" placeholder="請輸入電話號碼" required>
    </div>

    <div class="form-group">
      <label for="amount">數量：</label>
      <input type="number" id="amount" min="1" value="1" required>
    </div>

    <button type="submit" id="submitBtn">送出預約</button>
  </form>

  <p id="msg"></p>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="./main.js"></script>

  <script>
    const form = document.getElementById("orderForm");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submitBtn");
    const stockInfo = document.getElementById("stockInfo");

    // 頁面開啟時先檢查庫存
    async function checkStock() {
      try {
        // 1. 從資料庫抓取管理員設定的每日總量
        const config = await getStockConfig();
        const MAX_STOCK = config.max;

        // 2. 抓取「今天」已下單的總數
        const today = getTodayStr();
        const snap = await db.collection("orders").where("date", "==", today).get();
        
        let totalSoldToday = 0;
        snap.forEach(doc => {
          totalSoldToday += Number(doc.data().amount || 0);
        });

        const remain = MAX_STOCK - totalSoldToday;
        
        // 3. 更新介面顯示
        stockInfo.innerText = `今日剩餘：${remain > 0 ? remain : 0} 份 (每日限定 ${MAX_STOCK} 份)`;

        if (remain <= 0) {
          submitBtn.disabled = true;
          submitBtn.innerText = "今日已售罄，明天請早";
          stockInfo.style.color = "red";
          return 0;
        }
        return remain;
      } catch (err) {
        console.error("檢查庫存失敗:", err);
        stockInfo.innerText = "無法取得庫存資訊";
        return 0;
      }
    }

    // 初始化檢查
    checkStock();

    // 處理表單送出
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      // 送出前再次即時檢查庫存
      const remain = await checkStock();
      const inputAmount = Number(document.getElementById("amount").value);

      if (inputAmount > remain) {
        alert(`抱歉，庫存不足！目前只剩 ${remain} 份。`);
        return;
      }

      // 準備資料
      const data = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        amount: inputAmount
      };

      submitBtn.disabled = true;
      msg.innerText = "🚀 訂單傳送中，請稍候...";
      msg.style.color = "blue";

      try {
        // 呼叫 main.js 裡的建立訂單功能
        const no = await createOrder(data);
        // 跳轉到成功頁面並帶上號碼牌
        location.href = `/success.html?no=${no}`;
      } catch (err) {
        alert("預約失敗，請聯絡店家：" + err.message);
        msg.innerText = "";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
