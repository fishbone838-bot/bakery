<div class="admin-form" style="margin-bottom: 20px; border: 2px solid #ff69b4;">
  <h3>⚙️ 每日限量設定</h3>
  今日總量：<input type="number" id="maxInput" style="width:60px">
  <button onclick="saveStock()">儲存設定</button>
  <p id="currentStockHint" style="font-size: 0.8em; color: gray;"></p>
</div>

<script>
// 在 load() 函數中加入讀取庫存設定的邏輯
async function load() {
  // 1. 讀取庫存設定
  const config = await getStockConfig();
  document.getElementById("maxInput").value = config.max;

  // 2. 讀取訂單 (原本的邏輯)
  const orders = await getOrders();
  const list = document.getElementById("list");
  list.innerHTML = "";
  
  // 計算已售出數量
  let soldCount = 0;
  orders.forEach(o => {
    soldCount += Number(o.amount);
    // ... 這裡保留你原本表格渲染的 code ...
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${o.number}</td><td>${o.name}</td><td>${o.phone}</td><td>${o.amount}</td><td><select onchange="updateStatus('${o.id}', this.value)"><option value="未取貨" ${o.status=="未取貨"?"selected":""}>未取貨</option><option value="已取貨" ${o.status=="已取貨"?"selected":""}>已取貨</option></select></td><td>${o.time?.toDate().toLocaleString() || "無時間"}</td>`;
    list.appendChild(tr);
  });
  
  document.getElementById("currentStockHint").innerText = `目前已預約：${soldCount} 份 / 剩餘：${config.max - soldCount} 份`;
}

// 儲存設定的按鈕功能
async function saveStock() {
  const val = document.getElementById("maxInput").value;
  await updateStockConfig(val);
  alert("設定已更新！");
  location.reload();
}
</script>
